        <!-- Home page content -->
         <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Data Consultance authentication">
    <title>Data Consultance - Login</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="auth-container">

        <!-- Left side -->
        <section class="auth-brand">
            <div class="brand-content">
                <div class="logo">
                    DATA <span>CONSULTANCE</span>
                </div>

                <h1>Transform your data.<br>Grow your business.</h1>

                <p>
                    Turn your data into better decisions,
                    measurable performance and strategic advantage.
                </p>
            </div>
        </section>


        <!-- Right side -->
        <section class="auth-section">

            <div class="auth-card">

                <!-- LOGIN -->
                <div id="loginForm">

                    <div class="form-header">
                        <h2>Welcome Back</h2>
                        <p>Sign in to your account</p>
                    </div>

                    <form id="login">

                        <div class="form-group">
                            <label for="loginEmail">Email Address</label>

                            <input
                                type="email"
                                id="loginEmail"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                            <small class="error-message" id="loginEmailError"></small>
                        </div>


                        <div class="form-group">
                            <label for="loginPassword">Password</label>

                            <div class="password-wrapper">
                                <input
                                    type="password"
                                    id="loginPassword"
                                    name="password"
                                    placeholder="Enter your password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    data-target="loginPassword"
                                    aria-label="Show password"
                                >
                                    Show
                                </button>
                            </div>

                            <small class="error-message" id="loginPasswordError"></small>
                        </div>


                        <div class="form-options">

                            <label class="remember">
                                <input
                                    type="checkbox"
                                    id="rememberMe"
                                    name="rememberMe"
                                >

                                <span>Remember Me</span>
                            </label>

                            <a href="#" id="forgotPassword">
                                Forgot Password?
                            </a>

                        </div>


                        <button type="submit" class="submit-btn">
                            Login
                        </button>

                    </form>


                    <p class="switch-form">
                        Don't have an account?
                        <button type="button" id="showRegister">
                            Create Account
                        </button>
                    </p>

                </div>


                <!-- REGISTER -->
                <div id="registerForm" class="hidden">

                    <div class="form-header">
                        <h2>Create Account</h2>
                        <p>Join Data Consultance today</p>
                    </div>


                    <form id="register">

                        <div class="form-group">
                            <label for="registerEmail">Email Address</label>

                            <input
                                type="email"
                                id="registerEmail"
                                name="email"
                                placeholder="Enter your email"
                                required
                            >

                            <small
                                class="error-message"
                                id="registerEmailError"
                            ></small>
                        </div>


                        <div class="form-group">
                            <label for="registerPassword">Password</label>

                            <div class="password-wrapper">

                                <input
                                    type="password"
                                    id="registerPassword"
                                    name="password"
                                    placeholder="Create a password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    data-target="registerPassword"
                                    aria-label="Show password"
                                >
                                    Show
                                </button>

                            </div>

                            <small
                                class="error-message"
                                id="registerPasswordError"
                            ></small>
                        </div>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
    </main>

    <!-- Footer is injected here (components/footer.html) -->
    <footer id="footer-placeholder"></footer>

    <script src="js/components/navbar.js"></script>
    <script src="js/components/footer.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages/home.js"></script>
</body>
</html>
